<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דאשבורד לידים - סטודיו שקד</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Heebo', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            cream: '#F7F3EC',
            sand: '#EDE6D6',
            taupe: '#8B8178',
            wood: '#AD8A64',
            sage: '#7E9680',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-cream text-taupe font-sans min-h-screen">

  <header class="bg-sand border-b border-stone-300 px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
    <h1 class="text-xl sm:text-2xl font-semibold text-wood">סטודיו שקד - דאשבורד לידים</h1>
    <button type="button" disabled
      class="bg-sage/40 text-cream font-medium px-4 py-2 rounded-lg cursor-not-allowed opacity-60">
      הוספת ליד
    </button>
  </header>

  <main class="px-4 sm:px-6 py-6 space-y-6">

    <!-- כרטיסי מדדים -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white border border-sand rounded-xl p-4 shadow-sm">
        <p class="text-sm text-taupe">לידים פעילים</p>
        <p id="kpi-active-value" class="text-2xl font-semibold text-wood mt-2">—</p>
      </div>
      <div class="bg-white border border-sand rounded-xl p-4 shadow-sm">
        <p class="text-sm text-taupe">שווי צנרת</p>
        <p id="kpi-pipeline-value" class="text-2xl font-semibold text-wood mt-2">—</p>
      </div>
      <div class="bg-white border border-sand rounded-xl p-4 shadow-sm">
        <p class="text-sm text-taupe">פגישות ייעוץ החודש</p>
        <p id="kpi-consultations-value" class="text-2xl font-semibold text-wood mt-2">—</p>
      </div>
      <div class="bg-white border border-sand rounded-xl p-4 shadow-sm">
        <p class="text-sm text-taupe">אחוז סגירה</p>
        <p id="kpi-conversion-value" class="text-2xl font-semibold text-wood mt-2">—</p>
      </div>
    </section>

    <!-- גרפים -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white border border-sand rounded-xl p-4 shadow-sm min-h-[260px] flex flex-col">
        <h2 class="text-lg font-semibold text-wood mb-3">משפך מכירות</h2>
        <div id="chart-funnel-container" class="flex-1 h-64 relative">
          <canvas id="chart-funnel" role="img" aria-label="גרף עמודות אופקי המציג את מספר הלידים בכל שלב במשפך המכירות"></canvas>
        </div>
      </div>
      <div class="bg-white border border-sand rounded-xl p-4 shadow-sm min-h-[260px] flex flex-col">
        <h2 class="text-lg font-semibold text-wood mb-3">התפלגות שירותים</h2>
        <div id="chart-services-container" class="flex-1 h-64 relative">
          <canvas id="chart-services" role="img" aria-label="גרף עוגה המציג את התפלגות הלידים לפי סוג שירות"></canvas>
        </div>
      </div>
    </section>

    <!-- טבלת לידים -->
    <section class="bg-white border border-sand rounded-xl p-4 shadow-sm">
      <h2 class="text-lg font-semibold text-wood mb-3">טבלת לידים</h2>

      <div class="flex flex-col sm:flex-row gap-3 mb-4">
        <div class="flex-1">
          <label for="table-search" class="sr-only">חיפוש לפי שם או טלפון</label>
          <input
            type="text"
            id="table-search"
            placeholder="חיפוש לפי שם או טלפון"
            class="w-full border border-sand rounded-lg px-3 py-2 text-sm text-taupe focus:outline-none focus:ring-2 focus:ring-sage"
          >
        </div>
        <div class="flex items-center gap-2">
          <label for="table-filter-stage" class="text-sm text-taupe whitespace-nowrap">שלב</label>
          <select
            id="table-filter-stage"
            class="border border-sand rounded-lg px-3 py-2 text-sm text-taupe focus:outline-none focus:ring-2 focus:ring-sage"
          >
            <option value="all">הכול</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label for="table-filter-service" class="text-sm text-taupe whitespace-nowrap">סוג שירות</label>
          <select
            id="table-filter-service"
            class="border border-sand rounded-lg px-3 py-2 text-sm text-taupe focus:outline-none focus:ring-2 focus:ring-sage"
          >
            <option value="all">הכול</option>
          </select>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm text-right border-collapse">
          <thead>
            <tr class="border-b border-sand text-taupe">
              <th scope="col" class="py-2 px-3 font-semibold">שם</th>
              <th scope="col" class="py-2 px-3 font-semibold">טלפון</th>
              <th scope="col" class="py-2 px-3 font-semibold">שירות</th>
              <th scope="col" class="py-2 px-3 font-semibold">סוג נכס</th>
              <th scope="col" class="py-2 px-3 font-semibold">מקור</th>
              <th scope="col" class="py-2 px-3 font-semibold">שלב</th>
              <th
                scope="col"
                id="th-value"
                class="py-2 px-3 font-semibold cursor-pointer select-none"
                role="button"
                tabindex="0"
                aria-sort="none"
              >
                שווי משוער <span class="sort-arrow" aria-hidden="true"></span>
              </th>
              <th
                scope="col"
                id="th-date"
                class="py-2 px-3 font-semibold cursor-pointer select-none"
                role="button"
                tabindex="0"
                aria-sort="descending"
              >
                תאריך פנייה <span class="sort-arrow" aria-hidden="true"></span>
              </th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <p id="table-count" class="text-xs text-taupe/70 mt-3"></p>
    </section>

  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
